# Global components — matched on every view (calcifer web UI, "hearth").
# These make up the authed app shell. Sub-components are nested with `children:`,
# which scopes each child's selector to its parent's subtree (so children can use
# short, parent-relative selectors) and records ownership in one place. The shell
# is absent on the anonymous login screen, so there it reports as "not present".
#
# NB: component QUERIES support a descendant combinator (validated against this
# app via hover/click/fill/wait-for --component). `Parent[disc="…"] Child`
# resolves the Child under the parent whose property matches — so identical
# per-instance leaves (a row's star, a conversation's ⋯, an archived row's
# Rescue) are addressable through their container's discriminator:
# `ConversationItem[title^="…"] MenuButton`, `ArchiveRow[title="…"] RescueButton`
# — no snapshot-id fallback needed. An UNSCOPED descendant (`ConversationItem
# MenuButton`) is ambiguous across rows; add the parent predicate to pick one.
# Whitespace is the (any-depth) descendant combinator; there is no `>` child
# combinator (it's a parse error).
#
# Caveat: `browser bounds` is bare-component-NAME only (no property predicates
# or descendant queries) — use it to box every instance of a named component,
# not to resolve a single one. The interaction verbs (click/fill/hover/wait-for)
# are the ones that take full component queries.
version: 1
memory:
  - >-
    Selectors: this app's classNames are hand-authored and stable (plain Vite
    build, not CSS-modules/hashed), so class selectors are safe here. Prefer
    them; add a data attribute in the source only if a class becomes ambiguous.
  - >-
    The global rail/shell components render only when signed in. On the
    signed-out login capture they are legitimately absent (presence, not a dead
    selector).
  - >-
    The UI is served from web/dist. After editing web/src, run `cd web && npm
    run build` and reload the tab — an unreloaded tab runs the old bundle
    (e.g. .rail-archived read 0 until reload).
components:
  # The left navigation rail: brand, app links, conversation list, archive, sign
  # out. Collapses to an icon strip on desktop; becomes a drawer on mobile.
  - name: Sidebar
    selector: 'nav.rail'
    source: web/src/App.tsx
    description: Left navigation rail (Apps + Conversations) rendered by Shell.
    children:
      - name: Brand
        selector: '.rail-brand'
        description: '"hearth" wordmark at the top of the rail.'
      - name: CollapseButton
        selector: '.rail-collapse'
        description: Desktop-only chevron that collapses/expands the rail.
      # Chat + one per installed view app. The label is the per-instance
      # discriminator so NavLink[label="Books"] resolves one.
      - name: NavLink
        selector: '.rail-link'
        description: A destination link in the rail (Chat or an app view).
        properties:
          - name: label
            extract: '.rail-label'
      - name: NewChatButton
        selector: '.thread-list-new'
        source: web/src/ui/ThreadList.tsx
        description: Starts a fresh conversation.
      # One row per active (non-archived) conversation. Title varies per
      # instance; the "⋯" button and its popover menu nest inside.
      - name: ConversationItem
        selector: '.thread-list-item'
        source: web/src/ui/ThreadList.tsx
        description: An active conversation row; opens the thread on click.
        properties:
          - name: title
            extract: '.thread-list-item-trigger'
        children:
          - name: MenuButton
            selector: '.thread-item-menu-btn'
            description: The "⋯" overflow trigger (one per row; reach via ConversationItem[title^="…"] MenuButton).
      - name: ArchivedButton
        selector: '.rail-archived'
        description: Opens the archived-conversations browser modal.
      - name: SignOutButton
        selector: '.rail-logout'
        description: Ends the session (only shown when auth is required).

  # The Rename/Archive popover raised by a conversation's "⋯" button. Only one is
  # ever open, and .thread-item-menu is globally unique, so it lives at top level
  # (kept out of ConversationItem to avoid a 4-deep scoped selector).
  - name: Menu
    selector: '.thread-item-menu'
    source: web/src/ui/ThreadList.tsx
    description: Per-conversation overflow menu (Rename, Archive).
    children:
      - name: MenuAction
        selector: '.thread-item-menu-action'
        description: An action in the overflow menu (Pin/Unpin | Rename | Archive).
        properties:
          - name: label
            extract: text

  # Floating hamburger; sibling of the rail (not inside it). Opens the drawer on
  # mobile or re-expands a collapsed rail.
  - name: NavToggle
    selector: '.nav-toggle'
    source: web/src/App.tsx
    description: Mobile/collapsed-rail navigation toggle.

  # Archived-conversation browser: a modal rendered in Shell (a sibling of the
  # rail, not a descendant), raised by ArchivedButton. Targets the outer
  # role="dialog" overlay so the dialog node itself is covered.
  - name: ArchiveBrowser
    selector: '.archive-overlay'
    source: web/src/ui/ArchiveBrowser.tsx
    description: Modal listing archived conversations with a name filter.
    children:
      - name: ArchiveClose
        selector: '.archive-close'
        description: Closes the archive browser.
      - name: ArchiveSearch
        selector: '.archive-search'
        description: Client-side name filter for the archived list.
      # One archived row; title varies per instance. Its Rescue button nests
      # inside (reach via ArchiveRow[title="…"] RescueButton).
      - name: ArchiveRow
        selector: '.archive-row'
        description: An archived conversation row.
        properties:
          - name: title
            extract: '.archive-row-title'
        children:
          - name: RescueButton
            selector: '.archive-rescue'
            description: Restores this archived conversation to the active list.
