# App record/document detail (route "/app/*/*/**") — one record or file. Two
# flavors share ViewDetail.tsx: a record (field table + note + timeline, e.g. an
# apartment) and a rendered document (breadcrumbs + prose + structured
# frontmatter, e.g. a wiki .md). Capture one of each so the set unions both.
version: 1
views:
  - name: AppDetail
    # Route globs: `*` matches exactly one path segment and `**` matches zero or
    # more. sightmap decodes %2F before matching, so an fs document id
    # (family%2FJay%2FJay.md) expands into multiple segments. Hence AppDetail is
    # `/app/*/*/**` (3+ segments) and AppList is `/app/*` (exactly 2).
    route: "/app/*/*/**"
    url: "http://localhost:8787/app/apartments/se-5113565"
    source: web/src/views/ViewDetail.tsx
    memory:
      - >-
        Route globs: `*` matches exactly one path segment and `**` matches zero
        or more. sightmap decodes %2F before matching, so an fs document id
        (family%2FJay%2FJay.md) expands into multiple segments. Hence AppDetail
        is `/app/*/*/**` (3+ segments) and AppList is `/app/*` (exactly 2).
      - >-
        Two flavors share this view: a record (FieldsTable + NoteEditor +
        Timeline) and a rendered document (DetailCrumbs + Document + Prose +
        FrontmatterPanel). Each flavor's components are absent from the other's
        capture.
    components:
      # Global shell reliably present on every detail page. (ArchiveBrowser / Menu
      # stay auto-globals, not $ref'd here — they're transient overlays absent
      # from these captures.)
      - $ref: Sidebar
      - $ref: NavToggle

      # Record flavor: single back-link to the list.
      - name: DetailBack
        selector: '.detail-back'
        source: web/src/views/ViewDetail.tsx
        description: Back-link to the record list.
        properties:
          - name: label
            extract: text

      # Document flavor: folder breadcrumb trail (last hop is the non-link file).
      - name: DetailCrumbs
        selector: '.detail-crumbs'
        source: web/src/views/ViewDetail.tsx
        description: Breadcrumb trail for a file opened from a browse view.
        children:
          - name: Crumb
            selector: '.crumb'
            description: One breadcrumb hop (current file is a non-navigable span).
            properties:
              - name: label
                extract: text

      # Star / Open / Download all share .icon-button, distinguished by label.
      - name: DetailActions
        selector: '.detail-actions'
        source: web/src/views/ViewDetail.tsx
        description: Per-record actions (star, and for files open/download).
        children:
          - name: Action
            selector: '.icon-button'
            description: A detail action (star / open / download).
            properties:
              - name: label
                extract: text

      # Record flavor: shared editable note.
      - name: NoteEditor
        selector: '.note-editor'
        source: web/src/views/ViewDetail.tsx
        description: Shared free-text note for the record.
        children:
          - name: NoteInput
            selector: '.note-input'
            description: The note textarea (saves on blur).

      # Record flavor: key/value field table (linked values scoped inside).
      - name: FieldsTable
        selector: '.detail-fields'
        source: web/src/views/ViewDetail.tsx
        description: Field table for a record without a rendered document.

      # Document flavor: rendered markdown + structured frontmatter.
      - name: Document
        selector: '.doc'
        source: web/src/views/ViewDetail.tsx
        description: Rendered document container.
        children:
          - name: FrontmatterPanel
            selector: '.doc-frontmatter'
            description: Collapsible structured-frontmatter panel (value-cell links inside).
          - name: Prose
            selector: '.prose'
            source: web/src/views/Prose.tsx
            description: Rendered markdown body; inline/wiki links scoped inside.

      # Record flavor: history timeline (when the manifest defines one).
      - name: Timeline
        selector: '.detail-timeline'
        source: web/src/views/ViewDetail.tsx
        description: Chronological history entries for the record.
