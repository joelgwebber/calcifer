# App list/browse (route "/app/*") — the index of one view "app". Three
# presentations share this route + backend (ViewIndex dispatches on the
# manifest): a card list (ViewList — records, e.g. Apartments), a dirs-first tree
# (ViewBrowse tree — Documents, Books, Family Wiki), and a thumbnail grid
# (ViewBrowse gallery — Pictures). Capture one of each so the set unions all
# three presentations' components. Sub-controls nest with `children:` (their
# selectors are scoped to the parent — e.g. a tab is just `button` within
# `.collection-tabs`).
version: 1
views:
  - name: AppList
    route: "/app/*"
    url: "http://localhost:8787/app/apartments"
    source: web/src/App.tsx
    memory:
      - >-
        Three presentations share this route (ViewIndex dispatches on the
        manifest): ItemCard (list), TreeRow (tree browse), GalleryTile (gallery
        browse). Only one renders per app, so the other two are absent from any
        single capture — the view set unions all three.
      - >-
        Pager is conditional: it renders only when a list's results exceed one
        page, so it is expected absent from the captured states.
    components:
      # Global shell reliably present on every app page. (ArchiveBrowser / Menu
      # are also global but transient overlays — left as auto-globals, not $ref'd
      # here, so coverage doesn't expect them in these closed-state captures.)
      - $ref: Sidebar
      - $ref: NavToggle

      # --- Shared header + search ---
      - name: ViewHeader
        selector: '.view-header'
        source: web/src/views/ViewList.tsx
        description: App title + result/item count.
      - name: SearchInput
        selector: '.view-search'
        source: web/src/views/ViewList.tsx
        description: Free-text search (list) / folder filter (tree, gallery). Enter to apply.

      # --- List presentation (ViewList.tsx) ---
      - name: CollectionTabs
        selector: '.collection-tabs'
        source: web/src/views/ViewList.tsx
        description: Collection selector strip (All + manifest-defined collections).
        children:
          - name: Tab
            selector: 'button'
            description: One collection tab.
            properties:
              - name: label
                extract: text
      - name: SortSelect
        selector: '.view-sort'
        source: web/src/views/ViewList.tsx
        description: Sort-order dropdown.
      - name: FilterPanel
        selector: '.view-filters'
        source: web/src/views/Filters.tsx
        description: Declarative filter sidebar.
        children:
          - name: FilterGroup
            selector: '.filter'
            description: One labeled filter control group (range / toggle / multiselect).
            properties:
              - name: label
                extract: '.filter-label'
      # One record card. Title varies per instance; the star / open / ask
      # controls all share .icon-button, distinguished by their label.
      - name: ItemCard
        selector: '.card'
        source: web/src/views/ViewList.tsx
        description: A record card linking to its detail page.
        properties:
          - name: title
            extract: '.card-title'
        children:
          - name: CardAction
            selector: '.icon-button'
            description: A per-card control (star toggle, external open, or ask).
            properties:
              - name: label
                extract: text
      # Conditional: renders only when a list's results exceed one page, so it is
      # absent from every captured state. Its prev/next buttons scope inside when
      # present (kept childless here to avoid a false "broken selector" flag).
      - name: Pager
        selector: '.pager'
        source: web/src/views/ViewList.tsx
        description: Prev/next pagination (only when results exceed one page).

      # --- Browse presentations (ViewBrowse.tsx): tree + gallery ---
      - name: Breadcrumbs
        selector: '.tree-crumbs'
        source: web/src/views/ViewBrowse.tsx
        description: Folder breadcrumb trail for a browse view.
        children:
          - name: Crumb
            selector: '.crumb'
            description: One breadcrumb hop (the current/last one is disabled).
            properties:
              - name: label
                extract: text
      # One file/folder row (tree). Name varies per instance; star / name /
      # download nest inside.
      - name: TreeRow
        selector: '.tree-row'
        source: web/src/views/ViewBrowse.tsx
        description: A folder or file row in the tree browser.
        properties:
          - name: name
            extract: '.tree-name'
        children:
          - name: RowStar
            selector: '.tree-star'
            description: Star toggle for this row (reach by snapshot id).
          - name: RowName
            selector: '.tree-name'
            description: The folder (descend) or file (open) control.
          - name: RowDownload
            selector: '.tree-dl'
            description: Download link (files only).
      # One tile (gallery). Name varies per instance; star / thumbnail nest inside.
      - name: GalleryTile
        selector: '.gtile'
        source: web/src/views/ViewBrowse.tsx
        description: A folder or image tile in the gallery browser.
        properties:
          - name: name
            extract: '.gtile-name'
        children:
          - name: TileStar
            selector: '.gtile-star'
            description: Star toggle for this tile (reach by snapshot id).
          - name: TileThumb
            selector: '.gtile-thumb'
            description: The image (open) or folder (descend) control.
