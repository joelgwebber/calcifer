# App list/browse (route "/app/*") — the index of one view "app". Three
# presentations share this route + backend (ViewIndex dispatches on the
# manifest): a card list (ViewList — records, e.g. Apartments), a dirs-first tree
# (ViewBrowse tree — Documents, Books, Family Wiki), and a thumbnail grid
# (ViewBrowse gallery — Pictures). Capture one of each so the set unions all
# three presentations' components.
version: 1
views:
  - name: AppList
    route: "/app/*"
    url: "http://localhost:8787/app/apartments"
    source: web/src/App.tsx
    memory:
      - >-
        Three presentations share this route (ViewIndex dispatches on the
        manifest): ItemCard (list), TreeRow (tree browse), GalleryTile (gallery
        browse). Only one renders per app, so the other two are absent from any
        single capture — the view set unions all three.
      - >-
        Pager is conditional: it renders only when a list's results exceed one
        page, so it is expected absent from the captured states.
    components:
      # --- Shared header + controls ---
      - name: ViewHeader
        selector: '.view-header'
        source: web/src/views/ViewList.tsx
        description: App title + result/item count.

      - name: SearchInput
        selector: '.view-search'
        source: web/src/views/ViewList.tsx
        description: Free-text search (list) / folder filter (tree, gallery). Enter to apply.

      # --- List presentation (ViewList.tsx) ---
      - name: CollectionTab
        selector: '.collection-tabs button'
        source: web/src/views/ViewList.tsx
        description: Collection selector (All + manifest-defined collections).
        properties:
          - name: label
            extract: text

      - name: SortSelect
        selector: '.view-sort'
        source: web/src/views/ViewList.tsx
        description: Sort-order dropdown.

      - name: FilterPanel
        selector: '.view-filters'
        source: web/src/views/Filters.tsx
        description: Declarative filter sidebar (range / toggle / multiselect controls scoped inside).

      - name: FilterGroup
        selector: '.filter'
        source: web/src/views/Filters.tsx
        description: One labeled filter control group.
        properties:
          - name: label
            extract: '.filter-label'

      # One record card. Title varies per instance; the record link, star toggle,
      # and open/ask actions (all .icon-button) are scoped inside it (T2).
      - name: ItemCard
        selector: '.card'
        source: web/src/views/ViewList.tsx
        description: A record card linking to its detail page.
        properties:
          - name: title
            extract: '.card-title'

      - name: Pager
        selector: '.pager'
        source: web/src/views/ViewList.tsx
        description: Prev/next pagination (only when results exceed one page).

      # --- Browse presentations (ViewBrowse.tsx): tree + gallery ---
      - name: Breadcrumbs
        selector: '.tree-crumbs'
        source: web/src/views/ViewBrowse.tsx
        description: Folder breadcrumb trail for a browse view.

      - name: Breadcrumb
        selector: '.tree-crumbs .crumb'
        source: web/src/views/ViewBrowse.tsx
        description: One breadcrumb hop (the current/last one is disabled).
        properties:
          - name: label
            extract: text

      # One file/folder row (tree presentation). Name varies per instance; the
      # star, open/descend link, and download are scoped inside it (T2).
      - name: TreeRow
        selector: '.tree-row'
        source: web/src/views/ViewBrowse.tsx
        description: A folder or file row in the tree browser.
        properties:
          - name: name
            extract: '.tree-name'

      # One tile (gallery presentation). Name varies per instance; the star and
      # thumbnail/descend control are scoped inside it (T2).
      - name: GalleryTile
        selector: '.gtile'
        source: web/src/views/ViewBrowse.tsx
        description: A folder or image tile in the gallery browser.
        properties:
          - name: name
            extract: '.gtile-name'
