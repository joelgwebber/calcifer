# Per-type field registry for `type: college` OKF concepts.
#
# LEAN by design (strong YAGNI): only fields we actually compare across schools live
# here, as BARE scalars in each record's frontmatter, grouped by criterion. Everything
# else — caveats, narrative, specific artifacts, sourcing — lives in greppable prose.
# We deliberately do NOT track per-field retrieved / source_url / confidence / notes;
# this is personal college research, not an academic citation graph.
#
# The tool (colleges.mjs) reads this for the field list, §4 "never read alone" pairings,
# and derived formulas. Extend per criteria/<name>.md when a field earns its place.

type: college

# Top-level identity keys every record carries (not compared as metrics).
identity: [title, location, institution_type, last_reviewed, undergraduates]

criteria:
  engagement:
    title: Student engagement & campus life
    spec: criteria/engagement.md
    fields:
      housing_upperclass_pct: { type: pct, label: "Upperclass housing %" }
      offcampus_pct: { type: pct, label: "Off-campus %", pair_with: presence_continuity_pct }
      grad_rate_6yr: { type: pct, label: "6-yr grad rate" }
      sections_under_20_pct: { type: pct, label: "Sections <20 %", pair_with: sections_50plus_pct }
      sections_50plus_pct: { type: pct, label: "Sections 50+ %" }
      presence_continuity_pct: { type: pct, label: "Presence continuity % (est)" }
      undergrad_orgs_active: { type: int, label: "Active undergrad orgs" }
      orgs_per_1000_undergrads:
        type: derived
        label: "Orgs per 1,000 undergrads"
        formula: "(undergrad_orgs_active / undergraduates) * 1000"
      coop_participation_pct: { type: pct, label: "Co-op participation %" }
    prose_sections:
      [voluntary_intellectual_life, organizational_density, faculty_access, civic_embeddedness, governance_friction, notable_artifacts]

  admissions:
    title: Admissions selectivity
    spec: criteria/admissions.md
    # admissions_process_type enum: stats_based | holistic | mixed (see criteria/admissions.md)
    fields:
      acceptance_rate_pct: { type: pct, label: "Acceptance rate %" }
      admissions_process_type: { type: enum, label: "Admissions process" }
    prose_sections: [selectivity_notes]

  academic_programs:
    title: Academic programs (subject fit)
    spec: criteria/academic_programs.md
    # offering_type enum: dedicated_major | dedicated_minor | via_consortium | individualized | none
    # (authoritative definitions live in criteria/academic_programs.md)
    fields:
      biology_offering_type: { type: enum, label: "Biology" }
      linguistics_offering_type: { type: enum, label: "Linguistics" }
      creative_writing_offering_type: { type: enum, label: "Creative writing" }
      arts_offering_type: { type: enum, label: "Arts" }
    prose_sections: [biology, linguistics, creative_writing, arts]
